name: Import SpeedyNote

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MoSuan
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import SpeedyNote source
        shell: bash
        run: |
          set -e
          git clone --depth 1 https://github.com/alpha-liu-01/SpeedyNote.git /tmp/SpeedyNote
          rm -rf /tmp/SpeedyNote/.git
          rm -rf /tmp/SpeedyNote/.github
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name 'README.md' -exec rm -rf {} +
          cp -a /tmp/SpeedyNote/. .
          printf '\n\n## 默算（MoSuan）\n\nWindows PDF 手写数学教学工具，基于 SpeedyNote 改造。\n' >> README.md

      - name: Commit imported source
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: import SpeedyNote base [skip ci]"
          git push origin main
