name: MoSuan Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main, mosuan-pdf-v01]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-make
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-pkg-config
            mingw-w64-clang-x86_64-cppwinrt
            mingw-w64-clang-x86_64-qt6-base
            mingw-w64-clang-x86_64-qt6-tools
            mingw-w64-clang-x86_64-qt6-svg
            mingw-w64-clang-x86_64-qt6-translations
            mingw-w64-clang-x86_64-mupdf
            mingw-w64-clang-x86_64-ntldd

      - name: Disable incompatible Windows Ink OCR
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p = 'CMakeLists.txt'
          $s = Get-Content $p -Raw
          $s = $s -replace 'set\(SPEEDYNOTE_ENABLE_WINDOWS_INK_OCR ON CACHE BOOL "" FORCE\)', 'set(SPEEDYNOTE_ENABLE_WINDOWS_INK_OCR OFF CACHE BOOL "" FORCE)'
          Set-Content -Path $p -Value $s -NoNewline

      - name: Build
        shell: pwsh
        timeout-minutes: 60
        run: |
          $ErrorActionPreference = 'Stop'
          $toolchainPath = "$env:RUNNER_TEMP\msys64\clang64"
          $env:PATH = "$toolchainPath\bin;$env:PATH"
          if (Test-Path build) { Remove-Item build -Recurse -Force }
          New-Item build -ItemType Directory | Out-Null
          Set-Location build
          cmake .. -G 'MinGW Makefiles' `
            -DCMAKE_C_COMPILER=clang `
            -DCMAKE_CXX_COMPILER=clang++ `
            -DCMAKE_MAKE_PROGRAM=mingw32-make `
            -DCMAKE_BUILD_TYPE=Release `
            -DENABLE_DEBUG_OUTPUT=OFF `
            -DSPEEDYNOTE_ENABLE_WINDOWS_INK_OCR=OFF `
            -DQT_PATH="$toolchainPath"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build . --config Release -- -j4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path speedynote.exe)) { throw 'speedynote.exe was not produced' }
          & windeployqt6 speedynote.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item speedynote.exe MoSuan.exe -Force
          Set-Location ..

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/* package -Recurse -Force
          Compress-Archive -Path package/* -DestinationPath MoSuan-Windows-x64.zip -Force

      - name: Upload MoSuan
        uses: actions/upload-artifact@v4
        with:
          name: MoSuan-Windows-x64
          path: MoSuan-Windows-x64.zip
          if-no-files-found: error
